<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
  Source for unlock.png: the "DON'T PANIC" logo shown on the boot / disk-unlock screen.
  Render at 800x188 with a transparent background (--default-background-color=00000000).
-->
    <title>Unlock Logo</title>

    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&display=block" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        width: 800px;
        height: 188px;
        background: transparent;
        overflow: hidden;
      }
      .logo {
        width: 800px;
        height: 188px;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          900 112px/1 "Rubik",
          "Nimbus Sans",
          sans-serif;
        letter-spacing: 2px;
        white-space: nowrap;
        color: #f04a23;
        -webkit-text-stroke: 12px #f2b632;
        paint-order: stroke fill;
      }
    </style>
  </head>
  <body>
    <div class="logo">DON’T PANIC</div>
  </body>
</html>
