<script>
// seeded RNG
let s = 42; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const W = 3440, H = 1440;
const c = document.getElementById('sky').getContext('2d');

// base
const g = c.createLinearGradient(0, 0, 0, H);
g.addColorStop(0, '#0c0907'); g.addColorStop(1, '#120c0a');
c.fillStyle = g; c.fillRect(0, 0, W, H);

// airbrushed nebula blobs
function blob(x, y, r, col, a) {
  const rg = c.createRadialGradient(x, y, 0, x, y, r);
  rg.addColorStop(0, col.replace('A', a)); rg.addColorStop(1, col.replace('A', 0));
  c.fillStyle = rg; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
}
c.globalCompositeOperation = 'lighter';
// diagonal galactic band from upper-right to centre
for (let i = 0; i < 70; i++) {
  const t = rnd();
  const x = 3500 - t * 2600 + (rnd() - 0.5) * 380;
  const y = -60 + t * 1050 + (rnd() - 0.5) * 300;
  const pal = ['rgba(120,40,22,A)', 'rgba(90,30,50,A)', 'rgba(150,70,25,A)', 'rgba(40,40,70,A)'];
  blob(x, y, 160 + rnd() * 320, pal[Math.floor(rnd() * pal.length)], 0.05 + rnd() * 0.07);
}
blob(2240, 760, 700, 'rgba(60,110,100,A)', 0.08);   // cool halo behind character
blob(600, 1300, 900, 'rgba(200,80,30,A)', 0.12);    // warm haze over planet
blob(3300, 1200, 600, 'rgba(70,40,90,A)', 0.10);
blob(200, 300, 600, 'rgba(70,40,90,A)', 0.08);

// stars
function star(x, y, r, a, col) {
  c.fillStyle = `rgba(${col},${a})`;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
}
const cols = ['255,246,220', '255,214,160', '200,220,255', '255,190,140'];
for (let i = 0; i < 4200; i++) {
  const x = rnd() * W, y = rnd() * H;
  const r = Math.pow(rnd(), 3) * 1.8 + 0.4;
  star(x, y, r, 0.25 + rnd() * 0.6, cols[Math.floor(rnd() * cols.length)]);
}
// denser band stars
for (let i = 0; i < 2200; i++) {
  const t = rnd();
  const x = 3500 - t * 2600 + (rnd() - 0.5) * 520 * rnd();
  const y = -60 + t * 1050 + (rnd() - 0.5) * 420 * rnd();
  star(x, y, rnd() * 1.1 + 0.3, 0.2 + rnd() * 0.5, cols[Math.floor(rnd() * cols.length)]);
}
// bright glinting stars
function glint(x, y, L, col) {
  blob(x, y, L * 0.5, `rgba(${col},A)`, 0.35);
  const lg = (dx, dy) => {
    const gr = c.createLinearGradient(x - dx, y - dy, x + dx, y + dy);
    gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(0.5, `rgba(${col},0.9)`); gr.addColorStop(1, `rgba(${col},0)`);
    c.strokeStyle = gr; c.lineWidth = 2; c.beginPath(); c.moveTo(x - dx, y - dy); c.lineTo(x + dx, y + dy); c.stroke();
  };
  lg(L, 0); lg(0, L); lg(L * 0.3, L * 0.3); lg(L * 0.3, -L * 0.3);
  star(x, y, 2.6, 1, '255,250,235');
}
[[2700, 140, 60], [3020, 620, 44], [480, 470, 50], [1560, 1000, 34], [2010, 120, 30], [3250, 260, 36], [1900, 1120, 26], [260, 860, 40], [2620, 1080, 48]]
  .forEach(([x, y, L], i) => glint(x, y, L, cols[i % 2 ? 1 : 0]));
c.globalCompositeOperation = 'source-over';

// ---- craters on the big planet ----
const NS = 'http://www.w3.org/2000/svg';
const cg = document.getElementById('craters');
const PX = 380, PY = 1990, PR = 1000;
s = 7;
const cr = [];
for (let i = 0; i < 400 && cr.length < 46; i++) {
  const x = -250 + rnd() * 1700, y = 960 + rnd() * 340;
  const dx = x - PX, dy = y - PY, d = Math.hypot(dx, dy);
  const r = 18 + Math.pow(rnd(), 2) * 95;
  if (d > PR - r * 0.6 - 8) continue;
  if (cr.some(o => Math.hypot(o.x - x, o.y - y) < (o.r + r) * 0.9)) continue;
  cr.push({ x, y, r, dx, dy, d });
}
cr.forEach(o => {
  const k = Math.sqrt(Math.max(0.05, 1 - Math.pow(o.d / PR, 2)));
  const ang = Math.atan2(o.dy, o.dx) * 180 / Math.PI;
  const grp = document.createElementNS(NS, 'g');
  grp.setAttribute('transform', `translate(${o.x},${o.y}) rotate(${ang}) scale(${Math.max(0.28, k)},1)`);
  grp.innerHTML =
    `<circle r="${o.r * 1.12}" fill="#ffb466" opacity="0.35"/>` +
    `<circle r="${o.r}" fill="url(#crater)"/>` +
    `<circle r="${o.r}" fill="none" stroke="#5a1a0c" stroke-width="${Math.max(2, o.r * 0.06)}" opacity="0.6"/>`;
  cg.appendChild(grp);
});

// ---- label backing boxes sized to text ----
document.querySelectorAll('#rlabels text').forEach(t => {
  const b = t.getBBox();
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', b.x - 18); r.setAttribute('y', b.y - 2);
  r.setAttribute('width', b.width + 36); r.setAttribute('height', b.height + 4);
  r.setAttribute('fill', '#0e0c0b');
  t.parentNode.insertBefore(r, t.parentNode.firstChild);
});
// ---- extruded title ----
function extrude(id, lines, depth, dx, dy, c0, c1) {
  const el = document.getElementById(id);
  for (let i = depth; i >= 1; i--) {
    const t = i / depth;
    const col = t > 0.85 ? c1 : c0;
    lines.forEach(([txt, y]) => {
      const tx = document.createElementNS(NS, 'text');
      tx.setAttribute('x', i * dx); tx.setAttribute('y', y + i * dy);
      tx.setAttribute('fill', col); tx.setAttribute('stroke', col); tx.setAttribute('stroke-width', 7);
      tx.setAttribute('stroke-linejoin', 'round');
      tx.textContent = txt; el.appendChild(tx);
    });
  }
}
extrude('titleExtrude', [['Mostly Harmless', 0]], 18, 1.1, 1.1, '#f04a23', '#9a2a14');
extrude('dpExtrude', [['DON’T', 0], ['PANIC!', 112]], 10, 0.9, 0.9, '#e8402a', '#8a2214');
</script>
