<script>
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};

// fit title inside safe zone
const ttl=document.getElementById('title');
document.fonts.ready.then(()=>{});
function fit(){const w=ttl.getComputedTextLength();if(w>2300){ttl.style.fontSize=(168*2300/w).toFixed(1)+'px';}}

// --- background: faint brownian random walks off both edges
const wk=document.getElementById('walks');
function walk(x,y,n,step,col,op,w){let d=`M${x.toFixed(1)} ${y.toFixed(1)}`;for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,s=step*(.4+rnd());x+=Math.cos(a)*s;y+=Math.sin(a)*s;d+=` L${x.toFixed(1)} ${y.toFixed(1)}`;}el('path',{d,stroke:col,'stroke-opacity':op,'stroke-width':w},wk);return [x,y];}
[[180,380],[300,1050],[120,760],[3260,420],[3150,1000],[3330,720]].forEach(([x,y],i)=>{
  const col=i%2?'#f2b632':'#f04a23';
  walk(x,y,260,26,col,.16,2);
});
const stars=document.getElementById('stars');
for(let i=0;i<420;i++){
  const x=rnd()*3440,y=rnd()*1440;
  const d=Math.abs(x-1720)/1720; if(rnd()>d*1.15) continue; if(x>1000&&x<2440&&y>60&&y<1180) continue;
  const big=rnd()<.08;
  el('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:big?2.4:(0.8+rnd()*1.1),fill:rnd()<.2?'#ffcc5c':'#e9dfcc','fill-opacity':(0.25+rnd()*0.5).toFixed(2)},stars);
}
const cg=document.getElementById('corners');
const box={x0:540,y0:40,x1:2900,y1:1410},L=46;
[[box.x0,box.y0,1,1],[box.x1,box.y0,-1,1],[box.x0,box.y1,1,-1],[box.x1,box.y1,-1,-1]].forEach(([x,y,sx,sy])=>{
  el('path',{d:`M${x} ${y+sy*L} L${x} ${y} L${x+sx*L} ${y}`},cg);
});

// --- probability dials
const dg=document.getElementById('dials');
const needles=[-60,35,178];
const marks=['LIKELY','UNLIKELY','HA!'];
[1210,1320,1430].forEach((cx,i)=>{
  if(cx>1420) cx=1420;
  const cy=618;
  el('circle',{cx,cy,r:44,fill:'#e9dfcc'},dg);
  el('circle',{cx,cy,r:44,fill:'none',stroke:'#f2b632','stroke-width':5},dg);
  for(let a=-135;a<=135;a+=27){const r=a*Math.PI/180;const r1=34,r2=a%54===0?24:29;
    el('line',{x1:cx+Math.sin(r)*r1,y1:cy-Math.cos(r)*r1,x2:cx+Math.sin(r)*r2,y2:cy-Math.cos(r)*r2,stroke:'#090807','stroke-width':3},dg);}
  const nr=needles[i]*Math.PI/180;
  el('line',{x1:cx,y1:cy,x2:cx+Math.sin(nr)*34,y2:cy-Math.cos(nr)*34,stroke:'#f04a23','stroke-width':6,'stroke-linecap':'round'},dg);
  el('circle',{cx,cy,r:7,fill:'#090807'},dg);
  const t=el('text',{x:cx,y:cy+66,class:'tiny',fill:'#8c7f6c'},dg);t.textContent=marks[i];
});

// --- brownian walk inside generator box
(function(){let x=1300,y=795,d=`M${x} ${y}`;for(let i=0;i<140;i++){const a=rnd()*Math.PI*2,s=8+rnd()*14;x=Math.min(1432,Math.max(1168,x+Math.cos(a)*s));y=Math.min(876,Math.max(730,y+Math.sin(a)*s));d+=` L${x.toFixed(1)} ${y.toFixed(1)}`;}
document.getElementById('walk').setAttribute('d',d);const e=document.getElementById('walkEnd');e.setAttribute('cx',x);e.setAttribute('cy',y);})();

// --- condenser plates
const cd=document.getElementById('condenser');
for(let i=0;i<9;i++){el('rect',{x:2020,y:600+i*32,width:96,height:20,rx:4,fill:i%2?'#f04a23':'#f2b632'},cd);}
el('rect',{x:2062,y:592,width:12,height:300,fill:'#090807'},cd);

// --- guesswork lights
const lg2=document.getElementById('lights');
const lit=['#ffcc5c','#ff7a2f','#4a3e33','#4a3e33','#f04a23','#6fb5a6'];
for(let r=0;r<5;r++)for(let c=0;c<4;c++){el('circle',{cx:2164+c*27,cy:622+r*30,r:9,fill:lit[Math.floor(rnd()*lit.length)]},lg2);}

// --- core bolts
const bg=document.getElementById('bolts');
for(let i=0;i<24;i++){const a=i/24*Math.PI*2;el('circle',{cx:1760+Math.cos(a)*221,cy:740+Math.sin(a)*221,r:4.5,fill:'#9a6a2f'},bg);}

// --- rays & particles in the field
const rg=document.getElementById('rays');
for(let i=0;i<36;i++){const a=i/36*Math.PI*2;el('line',{x1:1760+Math.cos(a)*120,y1:740+Math.sin(a)*120,x2:1760+Math.cos(a)*200,y2:740+Math.sin(a)*200,stroke:'#f04a23','stroke-opacity':i%2?.25:.5,'stroke-width':i%3?3:6},rg);}
const pg=document.getElementById('particles');
for(let i=0;i<70;i++){const a=rnd()*Math.PI*2,r=60+rnd()*125;const x=1760+Math.cos(a)*r,y=740+Math.sin(a)*r;
  if(x>1630&&x<1925&&y>560&&y<870) continue;
  el('circle',{cx:x,cy:y,r:2+rnd()*4,fill:rnd()<.5?'#ffcc5c':'#e9dfcc','fill-opacity':.85},pg);}

// --- emission: arcs & stray outcomes
const em=document.getElementById('emit');
for(let i=0;i<5;i++){const x=2570+i*34;el('path',{d:`M${x} ${560+i*8} Q${x+60} 740 ${x} ${920-i*8}`,stroke:i%2?'#f2b632':'#f04a23','stroke-width':6-i,'stroke-opacity':1-i*.17,'stroke-linecap':'round'},em);}
// little flowerpot
el('path',{d:'M2780 600 L2820 600 L2812 636 L2788 636 Z',fill:'#e8402a'},em);
el('rect',{x:2774,y:592,width:52,height:10,rx:3,fill:'#9a6a2f'},em);
el('path',{d:'M2800 592 C2796 575 2790 566 2784 560 M2800 592 C2806 572 2814 566 2822 562',stroke:'#a9b84c','stroke-width':4},em);
el('circle',{cx:2800,cy:566,r:8,fill:'#d77b8f'},em);
// die
const die=el('g',{transform:'translate(2770 840) rotate(-18)'},em);
el('rect',{x:-24,y:-24,width:48,height:48,rx:8,fill:'#e9dfcc'},die);
[[-11,-11],[11,11],[0,0],[11,-11],[-11,11]].forEach(([x,y])=>el('circle',{cx:x,cy:y,r:4.2,fill:'#090807'},die));
// question mark & tiny triangle & square
const q=el('text',{x:2690,y:690,fill:'#ffcc5c','font-family':'Archivo Black','font-size':54,transform:'rotate(12 2690 690)'},em);q.textContent='?';
el('path',{d:'M2690 960 l26 -44 l26 44 Z',fill:'#6fb5a6',transform:'rotate(20 2716 940)'},em);
el('rect',{x:2836,y:730,width:26,height:26,fill:'#f2b632',transform:'rotate(30 2849 743)'},em);
el('circle',{cx:2700,cy:520,r:10,fill:'#ff7a2f'},em);

// --- labels
const lg=document.getElementById('labels');
const T=(x,y)=>[1720+.85*(x-1861),728+.85*(y-760)];
function label(text,sub,ax0,ay0,ex,ey,side,hot){
  const [ax,ay]=T(ax0,ay0);
  const g=el('g',{},lg);
  const tx= side==='l'? ex-14 : ex+14, anc=side==='l'?'end':'start';
  el('path',{d:`M${ax} ${ay} L${ex} ${ey}`,stroke:'#090807','stroke-width':7,fill:'none','stroke-opacity':.8},g);
  el('path',{d:`M${ax} ${ay} L${ex} ${ey}`,stroke:'#e9dfcc','stroke-width':2,fill:'none'},g);
  el('circle',{cx:ax,cy:ay,r:6.5,fill:hot?'#ffcc5c':'#e9dfcc',stroke:'#090807','stroke-width':3},g);
  el('circle',{cx:ex,cy:ey,r:2.5,fill:'#e9dfcc'},g);
  const lines=text.split('|');let y=ey+9;
  lines.forEach((ln,k)=>{const t=el('text',{x:tx,y,class:'lbl'+(hot?' hot':''),'text-anchor':anc},g);t.textContent=ln;y+=32;});
  if(sub){const s=el('text',{x:tx,y:y-3,class:'sub','text-anchor':anc},g);s.textContent=sub;}
}
// left
label('COMMON-SENSE|BYPASS INTAKE',null,880,740,850,620,'l');
label('PROBABILITY DIALS','CALIBRATED TO TEA-STAINED',1210,600,1100,420,'l');
label('BROWNIAN MOTION|GENERATOR',null,1250,860,850,880,'l');
label('SPARE TOWEL','ALWAYS',1480,1080,1100,1060,'l');
// top
label('CORE CONTAINMENT RING',null,1620,535,1420,340,'l');
label('STEAM VECTORS',null,1765,600,1760,320,'r');
label('IMPROBABILITY LEVER','DO NOT PULL CASUALLY',2146,362,2070,360,'r');
label('COINCIDENCE CONDENSER',null,2030,612,2440,470,'r');
// right
